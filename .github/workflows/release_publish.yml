name: Release & Publish

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode: publish (build & push APKs) or cleanup (remove orphaned extensions from MHRepo)"
        required: true
        default: "publish"
        type: choice
        options:
          - publish
          - cleanup
          - cleanup-dry-run

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MHExtensions
        uses: actions/checkout@v4

      - name: Set up JDK
        if: inputs.mode == 'publish'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        if: inputs.mode == 'publish'
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # ============================================================================
      # PUBLISH MODE — build APKs and push to MHRepo
      # ============================================================================
      - name: Build extensions
        if: inputs.mode == 'publish'
        run: ./gradlew assembleDebug

      - name: Prepare signing key
        if: inputs.mode == 'publish'
        run: |
          if [ -n "${{ secrets.SIGNING_KEY }}" ]; then
            echo "${{ secrets.SIGNING_KEY }}" | base64 -d > /tmp/keystore.jks
          fi

      - name: Build signed release APKs
        if: inputs.mode == 'publish' && secrets.SIGNING_KEY != ''
        env:
          KEYSTORE_FILE: /tmp/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Publish to MHRepo
        if: inputs.mode == 'publish'
        env:
          REPO_PAT: ${{ secrets.REPO_PAT }}
          REPO_OWNER: marbou92
          REPO_NAME: MHRepo
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: python .github/scripts/publish-repo.py

      # ============================================================================
      # CLEANUP MODE — remove orphaned extensions from MHRepo
      # ============================================================================
      - name: Cleanup orphaned extensions (dry run)
        if: inputs.mode == 'cleanup-dry-run'
        env:
          REPO_PAT: ${{ secrets.REPO_PAT }}
          REPO_OWNER: marbou92
          REPO_NAME: MHRepo
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: python .github/scripts/publish-repo.py --cleanup --dry

      - name: Cleanup orphaned extensions
        if: inputs.mode == 'cleanup'
        env:
          REPO_PAT: ${{ secrets.REPO_PAT }}
          REPO_OWNER: marbou92
          REPO_NAME: MHRepo
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: python .github/scripts/publish-repo.py --cleanup
